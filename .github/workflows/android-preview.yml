name: Android Preview Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK and AAB
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lensigo-android-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Create preview release (only after successful build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.2.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab --target "$GITHUB_SHA" --prerelease --title "LENSIGO $TAG · Android preview" --notes "LENSIGO v0.2.0: CameraX Photo/Video, 12 offline photo filters, low-light brightening, EV controls, device-aware zoom, adaptive SD/HD recording, built-in gallery/editor and low-RAM options. Preview effects need Android 12+; on older Android the effect is applied to JPEG output. Experimental build: device tests outstanding. Debug APK is test-signed; release AAB is unsigned, not Play-ready."
