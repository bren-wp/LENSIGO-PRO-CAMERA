name: Android Preview Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pixel-exact LENSIGO launcher from approved source
        run: |
          python -m pip install --quiet Pillow==12.3.0 numpy==2.3.5 CairoSVG==2.8.2
          python tools/generate_launcher.py app/src/main/res/drawable-nodpi/lensigo_launcher.png
      - name: Audit all user-visible Android text
        run: python tools/audit_public_ui.py
      - name: Pixel audit and Play package unit checks
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Install SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK and AAB
        run: gradle :app:assembleDebug :app:bundleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease --stacktrace
      - name: Show complete lint report on failure
        if: failure()
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then cat "$REPORT"; fi
      - name: Verify package format and absence of unverified native code
        run: python tools/play_package_check.py app/build/outputs/apk/debug/app-debug.apk app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: lensigo-android-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Upload Android lint report
        uses: actions/upload-artifact@v4
        with:
          name: lensigo-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Create preview release (only after successful build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.7.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab --target "$GITHUB_SHA" --prerelease --title "LENSIGO $TAG · Android preview" --notes "LENSIGO $TAG: Photo 05 has a tap-following CameraX focus indicator, an actual saved-photo thumbnail in the gallery shortcut and meaningful shutter accessibility labels. Splash 01 has cyan arcs/fullscreen brand placement and Home 04 has an offline user-supplied sunset photograph with outlined modes. CameraX build/lint/unit tests do not establish 1:1 device screenshot parity. Preview: debug APK test-signed; AAB unsigned/not Play-ready."
