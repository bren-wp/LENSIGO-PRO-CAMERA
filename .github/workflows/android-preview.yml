name: Android Preview Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate pixel-exact LENSIGO launcher from approved source
        run: |
          python -m pip install --quiet Pillow==12.3.0 numpy==2.3.5 CairoSVG==2.8.2
          python tools/generate_launcher.py app/src/main/res/drawable-nodpi/lensigo_launcher.png
      - name: Pixel audit unit checks
        run: python -m unittest discover -s tools -p "test_*.py" -v
      - name: Install SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK and AAB
        run: gradle :app:assembleDebug :app:bundleRelease :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Show complete lint report on failure
        if: failure()
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then cat "$REPORT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: lensigo-android-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Upload Android lint report
        uses: actions/upload-artifact@v4
        with:
          name: lensigo-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          if-no-files-found: ignore
      - name: Create preview release (only after successful build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.6.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab --target "$GITHUB_SHA" --prerelease --title "LENSIGO $TAG · Android preview" --notes "LENSIGO 0.6.0 preview: redesigned Privacy and About screens, active permission settings, browser and licence navigation, hardened MediaStore listing, permission refresh after Android settings, cancellable camera countdown, back navigation and new test checks. 1:1 full-screen screenshots and physical-device tests pending. Debug APK test signed; release AAB unsigned."
