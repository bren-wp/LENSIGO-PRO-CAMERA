name: Android Preview Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK and AAB
        run: gradle :app:assembleDebug :app:bundleRelease :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lensigo-android-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
      - name: Create preview release (only after successful build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab --target "$GITHUB_SHA" --prerelease --title "LENSIGO $TAG · Android preview" --notes "LENSIGO v0.3.0: PRO Camera2 manual ISO/shutter/WB/MF with capability detection, Night extension when device supports it, Portrait Bokeh extension with honest center-blur fallback, real portrait blur slider, 12 offline filters, improved low-RAM processing. Device-level and pixel-perfect screenshot tests pending. APK test-signed, AAB unsigned."
